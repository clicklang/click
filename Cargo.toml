[package]
name = "clicklang"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A language and verifier for proving properties of existing C programs"
homepage = "https://github.com/clicklang/click"
repository = "https://github.com/clicklang/click"
readme = "README.md"
keywords = ["formal-verification", "program-verification", "c"]
categories = ["command-line-utilities", "development-tools"]
default-run = "click"
# The command sources in `src/bin/` are modules of the `click` binary, which
# is the only one shipped; do not also build each as a standalone binary.
autobins = false

[features]
# One test-only verifier build for the budgeted gate; production targets run nightly.
fast-gate = []

[lib]
name = "click"

[[bin]]
name = "click"
path = "src/bin/click.rs"

[dependencies]
charon = { git = "https://github.com/AeneasVerif/charon", rev = "5d6b812e5f77dbf3d7f66c21b9b57091f0e084cb", default-features = false }
flate2 = "1"
imbl = "7"
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4.45"
tempfile = "3"

# No debug information: every test executable links all of Click, and line
# tables alone made each one about 60% larger. Panic and assertion messages
# still name their file and line, and backtraces name every function; for
# file/line in backtraces, rebuild with CARGO_PROFILE_DEV_DEBUG=line-tables-only
# and CARGO_PROFILE_TEST_DEBUG=line-tables-only. The test profile inherits this.
#
# `opt-level = 1` runs the gate's tests about 3.5 times faster than
# `opt-level = 0`, and an incremental rebuild after a small edit costs the
# same. `lto = "off"` drops the cross-codegen-unit ThinLTO pass that
# `opt-level = 1` would otherwise add, which took more than a third of a full
# rebuild and barely changed test speed. Debug assertions and overflow checks
# stay on. Measurements: `docs/internals/testing.md`, "Build profile".
[profile.dev]
debug = false
opt-level = 1
lto = "off"

# `build.rs` parses the kernel and surface trees with `syn` after every source
# edit, before rustc can start on Click; optimized, that takes 6 seconds
# instead of 28.
[profile.dev.build-override]
opt-level = 3

# An optimized build that keeps symbols and debug info, for sampling
# profilers (`scripts/profile-samply.sh`). Verification timing is judged in
# `click profile`; this profile is for finding where the wall-clock time goes
# inside the verifier.
[profile.profiling]
inherits = "release"
debug = true
strip = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace]
resolver = "3"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "aarch64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# Use tarballs for Windows too so the built-in version manager has one format to extract.
windows-archive = ".tar.gz"
# Checksums to generate for each App
checksum = "sha256"
# Path that installers should place binaries in
install-path = "~/.click/bin"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

[workspace.metadata.dist.binaries]
aarch64-apple-darwin = ["click"]
aarch64-unknown-linux-gnu = ["click"]
aarch64-unknown-linux-musl = ["click"]
aarch64-pc-windows-msvc = ["click"]
x86_64-apple-darwin = ["click"]
x86_64-unknown-linux-gnu = ["click"]
x86_64-unknown-linux-musl = ["click"]
x86_64-pc-windows-msvc = ["click"]

[build-dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"
