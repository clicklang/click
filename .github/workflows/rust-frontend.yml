name: Rust frontend release

on:
  pull_request:
    paths:
      - '.github/workflows/rust-frontend.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/build-charon.sh'
      - 'scripts/package-rust-frontend*'
      - 'src/languages/rust/runtime.rs'
      - 'src/languages/rust/charon-profile.json'
      - 'src/bin/click/version*.rs'
      - 'scripts/prepare-adler32-demo.py'
      - 'tests/rust_release_install.rs'
      - 'tests/support/rust_frontend.rs'
      - 'tests/support/release_assets.rs'
      - 'examples/basic-rust/**'
      - 'design/adler32/**'
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Click release tag to build the Rust frontend for
        required: true
        type: string

concurrency:
  group: rust-frontend-${{ github.event_name }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  linux-gnu:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version
        if: github.event_name != 'pull_request'
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'release tag must match Click version'
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          # The workspace target also contains a Git checkout. Rust's cache
          # strips its metadata; cache only the frontend build output instead.
          prefix-key: v1-rust-frontend
          key: rust-frontend-release
          cache-targets: false
          cache-directories: target/charon/release
      - name: Build pinned release frontend
        run: |
          set +e
          scripts/build-charon.sh --install-toolchain --release 2>&1 | tee "$RUNNER_TEMP/charon-build.log"
          build_status=${PIPESTATUS[0]}
          set -e
          if (( build_status != 0 )); then
            python3 - <<'PY'
          import os, pathlib
          log = pathlib.Path(os.environ['RUNNER_TEMP'], 'charon-build.log')
          tail = '\n'.join(log.read_text(errors='replace').splitlines()[-40:])
          tail = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Rust frontend build failed::{tail}')
          PY
          fi
          exit "$build_status"
      - name: Assemble frontend and compiler runtime
        run: |
          source scripts/charon-toolchain.sh
          scripts/package-rust-frontend-archive.sh target/rust-release target/charon/release "$CHARON_SYSROOT"
      - name: Install the release archive and verify Rust and C/Rust demonstrations
        env:
          CLICK_RUST_FRONTEND_ARCHIVE: ${{ github.workspace }}/target/rust-release/click-rust-frontend-x86_64-unknown-linux-gnu.tar.gz
          RUST_MIN_STACK: '8388608'
        run: cargo test --test rust_release_install rust_release_archive_installs_and_verifies -- --ignored
      - uses: actions/upload-artifact@v4
        with:
          name: rust-frontend-x86_64-unknown-linux-gnu
          path: target/rust-release/*.tar.gz*
      - name: Attach to the Click release
        if: github.event_name != 'pull_request'
        run: |
          # The main release workflow creates the release independently. Keep
          # the assets if it fails, so this job can be rerun after it is fixed.
          for attempt in {1..40}; do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                target/rust-release/*.tar.gz*
              exit 0
            fi
            sleep 30
          done
          echo "Click release $RELEASE_TAG is not available; frontend assets remain in the workflow artifact" >&2
          exit 1
