name: C++ frontend release

on:
  pull_request:
    paths:
      - '.github/workflows/cpp-frontend.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools/cpp-exporter/**'
      - 'scripts/build-cpp-exporter.sh'
      - 'scripts/install-llvm-release.sh'
      - 'scripts/package-cpp-frontend*'
      - 'src/languages/cpp/runtime.rs'
      - 'src/languages/cpp/frontend-profile.json'
      - 'src/bin/click/version*.rs'
      - 'tests/cpp_release_install.rs'
      - 'tests/support/release_assets.rs'
      - 'examples/basic-cpp/**'
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Click release tag to build the C++ frontend for
        required: true
        type: string

concurrency:
  group: cpp-frontend-${{ github.event_name }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  linux-gnu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - name: Check release version
        if: github.event_name != 'pull_request'
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'release tag must match Click version'
          PY
      # The official LLVM release, checked against its pinned SHA-256, has the
      # static Clang libraries and the lld that links them.
      - name: Install pinned LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libstdc++-14-dev zlib1g-dev libzstd-dev xz-utils
          sudo scripts/install-llvm-release.sh
      - name: Build the self-contained exporter
        run: LLVM_CONFIG=/usr/lib/llvm-19/bin/llvm-config scripts/build-cpp-exporter.sh --release
      - name: Package the frontend
        run: |
          scripts/package-cpp-frontend-archive.sh target/cpp-release \
            target/cpp-exporter-release /usr/lib/llvm-19/include/llvm/Support/LICENSE.TXT
      - name: Install the release archive and lock the basic C++ example
        env:
          CLICK_CPP_FRONTEND_ARCHIVE: ${{ github.workspace }}/target/cpp-release/click-cpp-frontend-x86_64-unknown-linux-gnu.tar.gz
          RUST_MIN_STACK: '8388608'
        run: cargo test --test cpp_release_install cpp_release_archive_installs_and_locks -- --ignored
      - uses: actions/upload-artifact@v4
        with:
          name: cpp-frontend-x86_64-unknown-linux-gnu
          path: target/cpp-release/*.tar.gz*
      - name: Attach to the Click release
        if: github.event_name != 'pull_request'
        run: |
          # The main release workflow creates the release independently. Keep
          # the assets if it fails, so this job can be rerun after it is fixed.
          for attempt in {1..40}; do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                target/cpp-release/*.tar.gz*
              exit 0
            fi
            sleep 30
          done
          echo "Click release $RELEASE_TAG is not available; frontend assets remain in the workflow artifact" >&2
          exit 1
