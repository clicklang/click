name: tests

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
    types: [checks_requested]

# A newer push to the same branch supersedes this run; only the tip matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine check scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # Queue checks validate the complete prospective upstream tree.
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
          else
            base="$BEFORE"
          fi

          # A missing base (for example, the first push) gets the full gate.
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]] || \
             ! git cat-file -e "$base^{commit}"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "$HEAD" | scripts/is-docs-only-change.sh; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/tools
          key: ${{ runner.os }}-click-tools-${{ hashFiles('scripts/tools.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-click-nextest-${{ hashFiles('scripts/setup-environment.sh') }}
      - name: Set up quality checks
        run: scripts/setup-environment.sh --docs-only
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting, Clippy, and documentation
        run: scripts/check.sh --ci-quality

  prepare:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Persist Click's own incremental compilation state as well as deps.
      CARGO_INCREMENTAL: '1'
    steps:
      - uses: actions/checkout@v4
      # Restore installed tools before the shared setup script runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/tools
          key: ${{ runner.os }}-click-tools-${{ hashFiles('scripts/tools.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-click-nextest-${{ hashFiles('scripts/setup-environment.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/llvm
          key: ${{ runner.os }}-${{ runner.arch }}-click-llvm-${{ hashFiles('scripts/setup-environment.sh') }}
      - name: Locate pinned Rust exporter runtime
        id: rust_runtime
        run: |
          source scripts/rust-exporter-toolchain.sh
          echo "path=$RUST_EXPORTER_SYSROOT" >> "$GITHUB_OUTPUT"
          echo "update_hash=$RUST_EXPORTER_UPDATE_HASH" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.rust_runtime.outputs.path }}
            ${{ steps.rust_runtime.outputs.update_hash }}
          key: ${{ runner.os }}-${{ runner.arch }}-click-rust-runtime-${{ hashFiles('scripts/rust-exporter-toolchain.sh') }}
      - name: Set up full test environment
        run: scripts/setup-environment.sh
      # Save a new snapshot per revision, restoring the latest compatible
      # build. Cargo validates freshness; source changes still get rebuilt.
      # rust-cache deliberately removes workspace and incremental artifacts,
      # so use the raw cache action for this build stage.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/rust-exporter
          key: ${{ runner.os }}-${{ runner.arch }}-click-build-v1-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'scripts/rust-exporter-toolchain.sh', 'scripts/build-rust-exporter.sh') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-click-build-v1-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'scripts/rust-exporter-toolchain.sh', 'scripts/build-rust-exporter.sh') }}-
      # Build every selected test binary and the C++ exporter once. All test
      # execution happens on consumers of this immutable build artifact.
      - name: Build exporters and test archive
        run: scripts/check.sh --ci-prepare "$RUNNER_TEMP/compiled-tests"
      # Caches may be evicted between prepare and its consumers. Keep an
      # immutable fallback from this same build, preserving executable modes.
      - name: Archive pinned Rust exporter runtime
        run: scripts/rust-exporter-runtime-archive.sh pack "$RUNNER_TEMP/rust-exporter-runtime.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-exporter-runtime
          path: ${{ runner.temp }}/rust-exporter-runtime.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-tests
          path: ${{ runner.temp }}/compiled-tests
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  test_shards:
    needs: [scope, prepare]
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: unit, partition: '1/4' }
          - { suite: unit, partition: '2/4' }
          - { suite: unit, partition: '3/4' }
          - { suite: unit, partition: '4/4' }
          - { suite: mdtests, partition: '1/1' }
          - { suite: examples, partition: '1/1' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-click-nextest-${{ hashFiles('scripts/setup-environment.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/llvm
          key: ${{ runner.os }}-${{ runner.arch }}-click-llvm-${{ hashFiles('scripts/setup-environment.sh') }}
      - name: Locate pinned Rust exporter runtime
        id: rust_runtime
        run: |
          source scripts/rust-exporter-toolchain.sh
          echo "path=$RUST_EXPORTER_SYSROOT" >> "$GITHUB_OUTPUT"
          echo "update_hash=$RUST_EXPORTER_UPDATE_HASH" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: rust_runtime_cache
        with:
          path: |
            ${{ steps.rust_runtime.outputs.path }}
            ${{ steps.rust_runtime.outputs.update_hash }}
          key: ${{ runner.os }}-${{ runner.arch }}-click-rust-runtime-${{ hashFiles('scripts/rust-exporter-toolchain.sh') }}
      - uses: actions/download-artifact@v4
        if: steps.rust_runtime_cache.outputs.cache-hit != 'true'
        with:
          name: rust-exporter-runtime
          path: ${{ runner.temp }}/rust-exporter-runtime
      - name: Restore pinned runtime after cache miss
        if: steps.rust_runtime_cache.outputs.cache-hit != 'true'
        run: scripts/rust-exporter-runtime-archive.sh restore "$RUNNER_TEMP/rust-exporter-runtime/rust-exporter-runtime.tar.gz"
      - name: Set up test runner
        run: scripts/setup-environment.sh --test-runner
      - uses: actions/download-artifact@v4
        with:
          name: compiled-tests
          path: ${{ runner.temp }}/compiled-tests
      - name: Run ${{ matrix.suite }} tests (${{ matrix.partition }})
        run: scripts/check.sh --ci-shard "$RUNNER_TEMP/compiled-tests" "${{ matrix.suite }}" "${{ matrix.partition }}"

  charon_live:
    needs: [scope, prepare]
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-click-nextest-${{ hashFiles('scripts/setup-environment.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/llvm
          key: ${{ runner.os }}-${{ runner.arch }}-click-llvm-${{ hashFiles('scripts/setup-environment.sh') }}
      - name: Locate pinned Rust exporter runtime
        id: rust_runtime
        run: |
          source scripts/rust-exporter-toolchain.sh
          echo "path=$RUST_EXPORTER_SYSROOT" >> "$GITHUB_OUTPUT"
          echo "update_hash=$RUST_EXPORTER_UPDATE_HASH" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: rust_runtime_cache
        with:
          path: |
            ${{ steps.rust_runtime.outputs.path }}
            ${{ steps.rust_runtime.outputs.update_hash }}
          key: ${{ runner.os }}-${{ runner.arch }}-click-rust-runtime-${{ hashFiles('scripts/rust-exporter-toolchain.sh') }}
      - uses: actions/download-artifact@v4
        if: steps.rust_runtime_cache.outputs.cache-hit != 'true'
        with:
          name: rust-exporter-runtime
          path: ${{ runner.temp }}/rust-exporter-runtime
      - name: Restore pinned runtime after cache miss
        if: steps.rust_runtime_cache.outputs.cache-hit != 'true'
        run: scripts/rust-exporter-runtime-archive.sh restore "$RUNNER_TEMP/rust-exporter-runtime/rust-exporter-runtime.tar.gz"
      - name: Set up test runner
        run: scripts/setup-environment.sh --test-runner
      - uses: actions/download-artifact@v4
        with:
          name: compiled-tests
          path: ${{ runner.temp }}/compiled-tests
      - name: Locate Charon toolchain cache
        id: charon_runtime
        run: |
          echo "toolchain=$(python3 -c 'import json; print(json.load(open("src/languages/rust/charon-profile.json"))["toolchain"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains/${{ steps.charon_runtime.outputs.toolchain }}-x86_64-unknown-linux-gnu
            target/charon-source
            target/charon
          key: ${{ runner.os }}-${{ runner.arch }}-click-charon-${{ hashFiles('src/languages/rust/charon-profile.json', 'scripts/build-charon.sh') }}
      - name: Build pinned Charon and compiler runtime
        run: scripts/build-charon.sh --install-toolchain
      - name: Re-extract and check Rust fixtures
        run: scripts/check.sh --ci-shard "$RUNNER_TEMP/compiled-tests" charon-live

  docs:
    needs: scope
    if: needs.scope.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/tools
          key: ${{ runner.os }}-click-tools-${{ hashFiles('scripts/tools.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-click-nextest-${{ hashFiles('scripts/setup-environment.sh') }}
      - name: Set up documentation environment
        run: scripts/setup-environment.sh --docs-only
      - name: Run documentation-only gate
        run: scripts/check.sh --docs-only

  test:
    # Keep one stable required check named `test` while the test suite runs
    # in parallel and docs-only changes continue to use their focused gate.
    if: always()
    needs: [scope, quality, prepare, test_shards, charon_live, docs]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the selected gate to pass
        env:
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          CHARON_RESULT: ${{ needs.charon_live.result }}
          SHARDS_RESULT: ${{ needs.test_shards.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          if [[ "$SCOPE_RESULT" != success ]]; then
            echo "check scope failed"
            exit 1
          fi
          if [[ "$DOCS_ONLY" == true ]]; then
            [[ "$DOCS_RESULT" == success ]] || { echo "documentation gate did not pass"; exit 1; }
          else
            [[ "$QUALITY_RESULT" == success ]] || { echo "quality checks did not pass"; exit 1; }
            [[ "$PREPARE_RESULT" == success ]] || { echo "full-gate preparation did not pass"; exit 1; }
            [[ "$CHARON_RESULT" == success ]] || { echo "live Charon gate did not pass"; exit 1; }
            [[ "$SHARDS_RESULT" == success ]] || { echo "one or more fixture partitions did not pass"; exit 1; }
          fi
