name: tests

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
    types: [checks_requested]

# A newer push to the same branch supersedes this run; only the tip matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine check scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # Queue checks validate the complete prospective upstream tree.
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
          else
            base="$BEFORE"
          fi

          # A missing base (for example, the first push) gets the full gate.
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]] || \
             ! git cat-file -e "$base^{commit}"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "$HEAD" | scripts/is-docs-only-change.sh; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
      # Cache actions restore before setup and save after the job. Setup can
      # reuse installed tools, and the completed run refreshes the caches.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/tools
          key: ${{ runner.os }}-click-tools-${{ hashFiles('scripts/tools.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-click-nextest-${{ hashFiles('scripts/setup-environment.sh') }}
      # One provisioning script serves CI and future cloud environments. Its
      # docs-only mode skips LLVM packages used only by the full gate.
      - name: Set up environment for documentation checks
        if: steps.scope.outputs.docs_only == 'true'
        run: scripts/setup-environment.sh --docs-only
      - name: Set up environment for full checks
        if: steps.scope.outputs.docs_only != 'true'
        run: scripts/setup-environment.sh
      # Restore Rust build artifacts after the pinned toolchain is available;
      # updated artifacts are saved automatically after the job completes.
      - uses: Swatinem/rust-cache@v2
      # The same script a developer runs locally, so the two cannot drift.
      - name: Run documentation-only gate
        if: steps.scope.outputs.docs_only == 'true'
        run: ./scripts/check.sh --docs-only
      - name: Run full gate
        if: steps.scope.outputs.docs_only != 'true'
        run: ./scripts/check.sh
