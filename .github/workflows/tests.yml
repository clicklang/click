name: tests

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
    types: [checks_requested]

# A newer push to the same branch supersedes this run; only the tip matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine check scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # Queue checks validate the complete prospective upstream tree.
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
          else
            base="$BEFORE"
          fi

          # A missing base (for example, the first push) gets the full gate.
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]] || \
             ! git cat-file -e "$base^{commit}"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "$HEAD" | scripts/is-docs-only-change.sh; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    needs: scope
    # A push to `master` is a tree the merge queue already checked.
    if: needs.scope.outputs.docs_only != 'true' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/tools
          key: ${{ runner.os }}-click-tools-${{ hashFiles('scripts/tools.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-click-nextest-${{ hashFiles('scripts/setup-environment.sh') }}
      - name: Set up quality checks
        run: scripts/setup-environment.sh --docs-only
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting, Clippy, and documentation
        run: scripts/check.sh --ci-quality

  prepare:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Persist Click's own incremental compilation state as well as deps.
      CARGO_INCREMENTAL: '1'
    steps:
      - uses: actions/checkout@v4
      # Restore installed tools before the shared setup script runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/tools
          key: ${{ runner.os }}-click-tools-${{ hashFiles('scripts/tools.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-click-nextest-${{ hashFiles('scripts/setup-environment.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/llvm
          key: ${{ runner.os }}-${{ runner.arch }}-click-llvm-${{ hashFiles('scripts/setup-environment.sh') }}
      - name: Locate pinned Charon compiler runtime
        id: rust_runtime
        run: |
          source scripts/charon-toolchain.sh
          echo "path=$CHARON_SYSROOT" >> "$GITHUB_OUTPUT"
          echo "update_hash=$CHARON_UPDATE_HASH" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.rust_runtime.outputs.path }}
            ${{ steps.rust_runtime.outputs.update_hash }}
          key: ${{ runner.os }}-${{ runner.arch }}-click-rust-runtime-${{ hashFiles('scripts/charon-toolchain.sh', 'src/languages/rust/charon-profile.json') }}
      - name: Set up full test environment
        run: scripts/setup-environment.sh
      # Restore the latest compatible build. Cargo validates freshness; source
      # changes still get rebuilt. rust-cache deliberately removes workspace
      # and incremental artifacts, so use the raw cache action for this build
      # stage. The snapshot is saved at the end of this job, on `master` only.
      - uses: actions/cache/restore@v4
        id: build_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/charon
          key: ${{ runner.os }}-${{ runner.arch }}-click-build-v1-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'scripts/charon-toolchain.sh', 'scripts/build-charon.sh', 'src/languages/rust/charon-profile.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-click-build-v1-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'scripts/charon-toolchain.sh', 'scripts/build-charon.sh', 'src/languages/rust/charon-profile.json') }}-
      # Build every selected test binary and the C++ exporter once. All test
      # execution happens on consumers of this immutable build artifact.
      - name: Build exporters and test archive
        run: scripts/check.sh --ci-prepare "$RUNNER_TEMP/compiled-tests"
      # Two artifacts: every test shard downloads the test binaries, and only
      # the Rust import shards download Charon and its compiler runtime,
      # which are nearly half of the build output.
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-tests
          path: |
            ${{ runner.temp }}/compiled-tests
            !${{ runner.temp }}/compiled-tests/rust
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: rust-toolchain
          path: ${{ runner.temp }}/compiled-tests/rust
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      # Every test shard waits for this whole job, and saving the build
      # snapshot takes about a minute. A pull request or merge-queue run can
      # only read `master`'s snapshots, so only a push to `master` saves one.
      # Save under the key the restore step computed: by now the build has
      # written Charon's own Cargo.toml and Cargo.lock files under `target/`,
      # so hashing `**/Cargo.toml` again would name a key no restore asks for.
      - uses: actions/cache/save@v4
        if: github.event_name == 'push'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/charon
          key: ${{ steps.build_cache.outputs.cache-primary-key }}

  test_shards:
    needs: [scope, prepare]
    # A push to `master` is a tree the merge queue already tested. Running
    # the shards again took a dozen runners for every merge and made the
    # runs that do gate something wait for one.
    if: needs.scope.outputs.docs_only != 'true' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The whole run has a ten-minute budget (docs/internals/testing.md).
          # The build job takes about six of them, so a shard has to finish
          # in under four, download and restore included. Add shards before
          # any one of them gets there, or move slow tests to nightly.yml.
          - { suite: unit, partition: '1/6' }
          - { suite: unit, partition: '2/6' }
          - { suite: unit, partition: '3/6' }
          - { suite: unit, partition: '4/6' }
          - { suite: unit, partition: '5/6' }
          - { suite: unit, partition: '6/6' }
          - { suite: rust, partition: '1/3' }
          - { suite: rust, partition: '2/3' }
          - { suite: rust, partition: '3/3' }
          - { suite: mdtests, partition: '1/3' }
          - { suite: mdtests, partition: '2/3' }
          - { suite: mdtests, partition: '3/3' }
          - { suite: examples, partition: '1/2' }
          - { suite: examples, partition: '2/2' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-click-nextest-${{ hashFiles('scripts/setup-environment.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/llvm
          key: ${{ runner.os }}-${{ runner.arch }}-click-llvm-${{ hashFiles('scripts/setup-environment.sh') }}
      - uses: actions/download-artifact@v4
        with:
          name: compiled-tests
          path: ${{ runner.temp }}/compiled-tests
      - uses: actions/download-artifact@v4
        if: matrix.suite == 'rust'
        with:
          name: rust-toolchain
          path: ${{ runner.temp }}/compiled-tests/rust
      - name: Restore pinned Charon runtime from the build artifact
        if: matrix.suite == 'rust'
        run: scripts/charon-runtime.sh restore "$RUNNER_TEMP/compiled-tests/rust/rust-runtime.tar.gz"
      - name: Set up test runner
        run: scripts/setup-environment.sh ${{ matrix.suite == 'rust' && '--rust-test-runner' || '--test-runner' }}
      - name: Run ${{ matrix.suite }} tests (${{ matrix.partition }})
        run: scripts/check.sh --ci-shard "$RUNNER_TEMP/compiled-tests" "${{ matrix.suite }}" "${{ matrix.partition }}"

  docs:
    needs: scope
    if: needs.scope.outputs.docs_only == 'true' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/tools
          key: ${{ runner.os }}-click-tools-${{ hashFiles('scripts/tools.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-click-nextest-${{ hashFiles('scripts/setup-environment.sh') }}
      - name: Set up documentation environment
        run: scripts/setup-environment.sh --docs-only
      - name: Run documentation-only gate
        run: scripts/check.sh --docs-only

  test:
    # Keep one stable required check named `test` while the test suite runs
    # in parallel and docs-only changes continue to use their focused gate.
    if: always()
    needs: [scope, quality, prepare, test_shards, docs]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the selected gate to pass
        env:
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SHARDS_RESULT: ${{ needs.test_shards.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$SCOPE_RESULT" != success ]]; then
            echo "check scope failed"
            exit 1
          fi
          # A push to `master` only builds, to save the build snapshot that
          # pull requests and the merge queue restore; the queue ran the gate
          # on this exact tree before merging it.
          if [[ "$EVENT_NAME" == push ]]; then
            [[ "$PREPARE_RESULT" == success || "$PREPARE_RESULT" == skipped ]] || { echo "post-merge build did not pass"; exit 1; }
            exit 0
          fi
          if [[ "$DOCS_ONLY" == true ]]; then
            [[ "$DOCS_RESULT" == success ]] || { echo "documentation gate did not pass"; exit 1; }
          else
            [[ "$QUALITY_RESULT" == success ]] || { echo "quality checks did not pass"; exit 1; }
            [[ "$PREPARE_RESULT" == success ]] || { echo "full-gate preparation did not pass"; exit 1; }
            [[ "$SHARDS_RESULT" == success ]] || { echo "one or more fixture partitions did not pass"; exit 1; }
          fi
