name: nightly

# Everything the budgeted gate leaves out, as four parallel jobs:
#
#   slow-tests            production builds, Clippy, CLI behavior, the tests
#                         marked `#[ignore = "nightly: ..."]`, the nightly
#                         examples and the live Charon re-extraction
#   expansion-audit       every smart tactic in the examples and mdtests
#                         expands to a simple proof that verifies
#   raise-lower-audit     every fact and goal round-trips through Surface
#   fact-stability-audit  lowering never depends on facts
#
# The three audits are `click audit <audit>` (`scripts/audit.sh`). The report
# fails on expansion and fact-stability failures and tracks the raise-lower
# counts night to night. None has a time budget.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  slow-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/tools
          key: ${{ runner.os }}-click-tools-${{ hashFiles('scripts/tools.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: ${{ runner.os }}-click-nextest-${{ hashFiles('scripts/setup-environment.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/llvm
          key: ${{ runner.os }}-${{ runner.arch }}-click-llvm-${{ hashFiles('scripts/setup-environment.sh', 'scripts/cache-llvm.sh') }}
      - name: Locate pinned Charon compiler runtime
        id: rust_runtime
        run: |
          source scripts/charon-toolchain.sh
          echo "path=$CHARON_SYSROOT" >> "$GITHUB_OUTPUT"
          echo "update_hash=$CHARON_UPDATE_HASH" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.rust_runtime.outputs.path }}
            ${{ steps.rust_runtime.outputs.update_hash }}
          key: ${{ runner.os }}-${{ runner.arch }}-click-rust-runtime-${{ hashFiles('scripts/charon-toolchain.sh', 'src/languages/rust/charon-profile.json') }}
      - name: Set up full test environment
        run: scripts/setup-environment.sh
      - uses: Swatinem/rust-cache@v2
      - name: Run production, CLI, and nightly checks
        env:
          CLICK_REQUIRE_FRONTENDS: 1
          CLICK_NIGHTLY_REPORT_DIR: ${{ runner.temp }}/nightly-report
        run: scripts/check.sh --nightly --no-fail-fast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slow-tests-results
          path: ${{ runner.temp }}/nightly-report
          if-no-files-found: ignore

  expansion-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/tools
          key: ${{ runner.os }}-click-tools-${{ hashFiles('scripts/tools.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/llvm
          key: ${{ runner.os }}-${{ runner.arch }}-click-llvm-${{ hashFiles('scripts/setup-environment.sh', 'scripts/cache-llvm.sh') }}
      - name: Set up full test environment
        run: scripts/setup-environment.sh
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Audit expansion of every smart tactic
        env:
          CLICK_NIGHTLY_REPORT_DIR: ${{ runner.temp }}/nightly-report
        run: scripts/check.sh --audit expansion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-audit-results
          path: ${{ runner.temp }}/nightly-report
          if-no-files-found: ignore

  raise-lower-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/tools
          key: ${{ runner.os }}-click-tools-${{ hashFiles('scripts/tools.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/llvm
          key: ${{ runner.os }}-${{ runner.arch }}-click-llvm-${{ hashFiles('scripts/setup-environment.sh', 'scripts/cache-llvm.sh') }}
      - name: Set up full test environment
        run: scripts/setup-environment.sh
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Audit the raise-lower round trip of every fact and goal
        env:
          CLICK_NIGHTLY_REPORT_DIR: ${{ runner.temp }}/nightly-report
        run: scripts/check.sh --audit raise-lower
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raise-lower-audit-results
          path: ${{ runner.temp }}/nightly-report
          if-no-files-found: ignore

  fact-stability-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/tools
          key: ${{ runner.os }}-click-tools-${{ hashFiles('scripts/tools.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/click/llvm
          key: ${{ runner.os }}-${{ runner.arch }}-click-llvm-${{ hashFiles('scripts/setup-environment.sh', 'scripts/cache-llvm.sh') }}
      - name: Set up full test environment
        run: scripts/setup-environment.sh
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Audit that lowering never depends on facts
        env:
          CLICK_NIGHTLY_REPORT_DIR: ${{ runner.temp }}/nightly-report
        run: scripts/check.sh --audit fact-stability
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fact-stability-audit-results
          path: ${{ runner.temp }}/nightly-report
          if-no-files-found: ignore

  # One short report per night: each failure's first line and the command
  # that reproduces it, which failures are new since the previous night, and
  # the slowest checks. It is committed to the `nightly-reports` branch, which
  # shares no history with `master`, and shown on the run page
  # (docs/internals/testing.md, "Nightly report").
  report:
    needs: [slow-tests, expansion-audit, raise-lower-audit, fact-stability-audit]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/results
      - name: Record job results
        run: |
          mkdir -p "$RUNNER_TEMP/results/jobs"
          {
            printf 'slow-tests\t%s\n' '${{ needs.slow-tests.result }}'
            printf 'expansion-audit\t%s\n' '${{ needs.expansion-audit.result }}'
            printf 'raise-lower-audit\t%s\n' '${{ needs.raise-lower-audit.result }}'
            printf 'fact-stability-audit\t%s\n' '${{ needs.fact-stability-audit.result }}'
          } > "$RUNNER_TEMP/results/jobs/jobs.tsv"
      - name: Build the report
        run: |
          if git fetch --depth 1 origin nightly-reports; then
            git show FETCH_HEAD:report.json > "$RUNNER_TEMP/previous.json" || true
            git worktree add "$RUNNER_TEMP/publish" FETCH_HEAD
          else
            git worktree add --orphan -b nightly-reports "$RUNNER_TEMP/publish"
          fi
          inputs=()
          for directory in "$RUNNER_TEMP"/results/*/; do
            inputs+=(--input "$directory")
          done
          python3 -I scripts/nightly-report.py "${inputs[@]}" \
            --previous "$RUNNER_TEMP/previous.json" \
            --out "$RUNNER_TEMP/publish" \
            --commit "$GITHUB_SHA" \
            --date "$(date -u +%Y-%m-%d)" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Publish the report
        working-directory: ${{ runner.temp }}/publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add report.md report.json
          git commit -m "Nightly $(date -u +%Y-%m-%d) at ${GITHUB_SHA:0:12}"
          git push origin HEAD:refs/heads/nightly-reports
